<title>Politique de confidentialité — Tempov</title>
<style>

    padding: 48px 20px 64px;
    line-height: 1.6;
  }

    width: 200px;

    height: auto;

    display: block;
  }

  ul { padding-left: 20px; margin: 8px 0; }
  li { margin-bottom: 6px; }
  a { color: #7dd3fc; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }

</head>
<body>
<img class="logo" src="/tempov.png" alt="Tempov" />
<h1 data-i18n="title">Politique de confidentialité de Tempov</h1>
<p class="updated" data-i18n="updated">Dernière mise à jour : 16 août 2026</p>

<div data-i18n-html="body"></div>

<script>
  var i18n = {
    fr: {
      title: "Politique de confidentialité de Tempov",
      updated: "Dernière mise à jour : 16 août 2026",
      body: `
        <p>Tempov ("nous") édite l'application mobile Tempov, disponible sur iOS. Cette politique décrit quelles données nous collectons, pourquoi, et comment elles sont utilisées.</p>

        <h2>Qui sommes-nous</h2>
        <p>Tempov est édité par Adrien Ralaidovy-Payet, entreprise individuelle (SIRET 108 370 651 00011), 173 rue de Courcelles, 75017 Paris, France. Pour toute question, écrivez à <a href="mailto:contact@tempov.app">contact@tempov.app</a>.</p>

        <h2>Données que nous collectons</h2>
        <table>
          <tr><th>Donnée</th><th>Pourquoi</th></tr>
          <tr><td>Nom, adresse e-mail</td><td>Créer et sécuriser votre compte, vous authentifier</td></tr>
          <tr><td>Localisation (précise et approximative)</td><td>Enregistrer vos sessions de travail, situer les lieux de travail (Maps), calculer le classement géographique</td></tr>
          <tr><td>Contenu que vous publiez (posts, commentaires, photos)</td><td>Afficher votre profil et le fil d'actualité de l'app</td></tr>
          <tr><td>Identifiant de compte, identifiant d'appareil</td><td>Authentification, prévention de la fraude (notamment sur le parrainage)</td></tr>
          <tr><td>Historique d'achats (abonnements)</td><td>Gérer votre abonnement et débloquer les fonctionnalités Pro, via Apple/RevenueCat</td></tr>
          <tr><td>Interaction avec l'app</td><td>Calculer le classement ELO, les défis, améliorer les fonctionnalités</td></tr>
          <tr><td>Données de pannes et de performance</td><td>Diagnostiquer les bugs, améliorer la stabilité et les performances</td></tr>
        </table>

        <h2>Ce que nous ne faisons pas</h2>
        <ul>
          <li>Nous ne vendons aucune donnée personnelle.</li>
          <li>Nous ne partageons aucune donnée avec des régies publicitaires tierces ou des data brokers.</li>
          <li>Nous n'utilisons vos données à aucune fin de suivi publicitaire (tracking) au sens de la définition d'Apple.</li>
          <li>Les informations de paiement (numéro de carte, etc.) ne transitent jamais par nos serveurs : les abonnements sont gérés directement par Apple (In-App Purchase / RevenueCat).</li>
        </ul>

        <h2>Où sont stockées vos données</h2>
        <p>Vos données sont hébergées chez Supabase (base de données et authentification), sur des serveurs situés dans l'Union européenne.</p>

        <h2>Vos droits</h2>
        <p>Conformément au RGPD, vous pouvez à tout moment demander l'accès, la rectification ou la suppression de vos données. Vous pouvez supprimer votre compte directement depuis l'app (Profil → Paramètres → Supprimer mon compte), ce qui efface définitivement vos données. Pour toute autre demande, contactez <a href="mailto:contact@tempov.app">contact@tempov.app</a>.</p>

        <h2>Conservation des données</h2>
        <p>Vos données sont conservées tant que votre compte est actif. En cas de suppression du compte, vos données personnelles sont supprimées de nos systèmes.</p>

        <h2>Modifications</h2>
        <p>Nous pouvons mettre à jour cette politique si nos pratiques évoluent. La date de dernière mise à jour est indiquée en haut de cette page.</p>
      `
    },
    en: {
      title: "Tempov Privacy Policy",
      updated: "Last updated: August 16, 2026",
      body: `
        <p>Tempov ("we") publishes the Tempov mobile app, available on iOS. This policy describes what data we collect, why, and how it is used.</p>

        <h2>Who we are</h2>
        <p>Tempov is published by Adrien Ralaidovy-Payet, sole proprietorship (SIRET 108 370 651 00011), 173 rue de Courcelles, 75017 Paris, France. For any question, write to <a href="mailto:contact@tempov.app">contact@tempov.app</a>.</p>

        <h2>Data we collect</h2>
        <table>
          <tr><th>Data</th><th>Why</th></tr>
          <tr><td>Name, email address</td><td>Create and secure your account, authenticate you</td></tr>
          <tr><td>Location (precise and approximate)</td><td>Record your work sessions, locate workplaces (Maps), compute geographic ranking</td></tr>
          <tr><td>Content you post (posts, comments, photos)</td><td>Display your profile and the app's feed</td></tr>
          <tr><td>Account identifier, device identifier</td><td>Authentication, fraud prevention (notably for referrals)</td></tr>
          <tr><td>Purchase history (subscriptions)</td><td>Manage your subscription and unlock Pro features, via Apple/RevenueCat</td></tr>
          <tr><td>App interaction</td><td>Compute ELO ranking, challenges, improve features</td></tr>
          <tr><td>Crash and performance data</td><td>Diagnose bugs, improve stability and performance</td></tr>
        </table>

        <h2>What we don't do</h2>
        <ul>
          <li>We do not sell any personal data.</li>
          <li>We do not share any data with third-party advertising networks or data brokers.</li>
          <li>We do not use your data for any advertising tracking purpose as defined by Apple.</li>
          <li>Payment information (card numbers, etc.) never passes through our servers: subscriptions are handled directly by Apple (In-App Purchase / RevenueCat).</li>
        </ul>

        <h2>Where your data is stored</h2>
        <p>Your data is hosted with Supabase (database and authentication), on servers located in the European Union.</p>

        <h2>Your rights</h2>
        <p>Under GDPR, you can request access, correction, or deletion of your data at any time. You can delete your account directly from the app (Profile → Settings → Delete my account), which permanently erases your data. For any other request, contact <a href="mailto:contact@tempov.app">contact@tempov.app</a>.</p>

        <h2>Data retention</h2>
        <p>Your data is kept as long as your account is active. If you delete your account, your personal data is removed from our systems.</p>

        <h2>Changes</h2>
        <p>We may update this policy if our practices change. The last update date is shown at the top of this page.</p>
      `
    }
  };
  var lang = (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en";
  document.documentElement.lang = lang;
  document.title = lang === "fr" ? "Politique de confidentialité — Tempov" : "Privacy Policy — Tempov";
  var t = i18n[lang];
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = t[el.getAttribute("data-i18n")];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    el.innerHTML = t[el.getAttribute("data-i18n-html")];
  });
</script>
</body>
</html>
