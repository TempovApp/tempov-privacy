<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ouvrir Tempov</title>
<meta name="robots" content="noindex" />
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0e0e10; color: #fff;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  p { opacity: 0.7; font-size: 14px; }
</style>
</head>
<body>
<p>Redirection…</p>
<script>
  (async function () {
    // Store URLs — keep in sync with the referral-redirect Supabase function.
    var IOS_STORE_URL = "https://apps.apple.com/app/id6801479295";
    var ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.tempov.app";

    var raw = new URLSearchParams(window.location.search).get("ref") || "";
    var referrerId = /^[0-9a-fA-F-]{36}$/.test(raw) ? raw : "";

    async function fallbackToStoreWithClipboard() {
      if (referrerId) {
        try {
          await navigator.clipboard.writeText('tempo-ref:' + referrerId);
        } catch (e) {
          // Clipboard write can fail without a user gesture on some browsers;
          // the referral is simply not attributed in that case, no hard failure.
        }
      }
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      window.location.replace(isIOS ? IOS_STORE_URL : ANDROID_STORE_URL);
    }

    if (!referrerId) {
      await fallbackToStoreWithClipboard();
      return;
    }

    // Try opening the app directly. If it's installed, this switches away from
    // the browser (the page is backgrounded/unloaded) and the timer below never
    // fires. If nothing happens within the delay, assume it's not installed and
    // fall back to the store + clipboard handoff.
    var fellBack = false;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) fellBack = true; // app opened, cancel the fallback
    });
    window.location.href = 'tempo://referral?ref=' + encodeURIComponent(referrerId);
    setTimeout(function () {
      if (!fellBack) void fallbackToStoreWithClipboard();
    }, 1200);
  })();
</script>
</body>
</html>
